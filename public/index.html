<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego Online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #20232a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #menu {
            width: 400px;
            max-width: 90%;
            margin: 60px auto;
            background: #2c3038;
            padding: 30px;
            border-radius: 15px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #codigoSala {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 5px;
            margin: 15px;
        }

        #juego {
            display: none;
        }

        #informacion {
            padding: 10px;
        }

        #cancha {
            width: 800px;
            height: 500px;
            max-width: 95vw;
            margin: auto;
            background: #6ab04c;
            border: 5px solid white;
            position: relative;
            overflow: hidden;
        }

        .jugador {
            width: 40px;
            height: 40px;
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .jugador1 {
            background: #3498db;
        }

        .otroJugador {
            background: #f1c40f;
        }

        #mensaje {
            color: #ffd166;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- MENU -->

    <div id="menu">

        <h1>🎮 Juego Online</h1>

        <h2>Crear sala</h2>

        <button id="crearSala">
            Crear sala
        </button>

        <hr>

        <h2>Unirse</h2>

        <input
            id="codigoInput"
            maxlength="5"
            placeholder="Código de sala"
            autocomplete="off"
        >

        <button id="unirseSala">
            Unirse a sala
        </button>

        <p id="mensaje"></p>

    </div>


    <!-- JUEGO -->

    <div id="juego">

        <div id="informacion">

            <h2>
                Sala:
                <span id="codigoSala"></span>
            </h2>

            <p>
                Jugadores:
                <span id="cantidadJugadores">0</span>
                /4
            </p>

            <p>
                Usá W A S D para moverte
            </p>

        </div>

        <div id="cancha"></div>

    </div>


    <!-- SOCKET.IO -->

    <script src="/socket.io/socket.io.js"></script>

    <script>

        // =========================
        // CONEXIÓN
        // =========================

        const socket = io();

        // Elementos HTML

        const menu = document.getElementById("menu");
        const juego = document.getElementById("juego");

        const crearSala =
            document.getElementById("crearSala");

        const unirseSala =
            document.getElementById("unirseSala");

        const codigoInput =
            document.getElementById("codigoInput");

        const codigoSala =
            document.getElementById("codigoSala");

        const cantidadJugadores =
            document.getElementById("cantidadJugadores");

        const cancha =
            document.getElementById("cancha");

        const mensaje =
            document.getElementById("mensaje");


        // =========================
        // VARIABLES
        // =========================

        let miId = null;

        let estoyEnJuego = false;

        let miJugador = {
            x: 200,
            y: 200
        };


        // =========================
        // CONEXIÓN AL SERVIDOR
        // =========================

        socket.on("connect", () => {

            miId = socket.id;

            console.log(
                "Conectado al servidor:",
                miId
            );

        });


        socket.on("disconnect", () => {

            console.log(
                "Desconectado del servidor"
            );

            mensaje.textContent =
                "Desconectado del servidor.";

        });


        // =========================
        // CREAR SALA
        // =========================

        crearSala.addEventListener("click", () => {

            mensaje.textContent =
                "Creando sala...";

            socket.emit("crearSala");

        });


        // =========================
        // UNIRSE A SALA
        // =========================

        unirseSala.addEventListener("click", () => {

            const codigo =
                codigoInput.value.trim().toUpperCase();


            if (codigo === "") {

                mensaje.textContent =
                    "Escribí un código.";

                return;
            }


            if (codigo.length !== 5) {

                mensaje.textContent =
                    "El código debe tener 5 caracteres.";

                return;
            }


            mensaje.textContent =
                "Uniéndote a la sala...";


            socket.emit(
                "unirseSala",
                codigo
            );

        });


        // =========================
        // SALA CREADA
        // =========================

        socket.on("salaCreada", (datos) => {

            entrarAlJuego(datos);

        });


        // =========================
        // SALA UNIDA
        // =========================

        socket.on("salaUnida", (datos) => {

            entrarAlJuego(datos);

        });


        // =========================
        // ENTRAR AL JUEGO
        // =========================

        function entrarAlJuego(datos) {

            menu.style.display = "none";

            juego.style.display = "block";

            estoyEnJuego = true;


            if (datos.codigo) {

                codigoSala.textContent =
                    datos.codigo;

            }


            if (datos.jugadores !== undefined) {

                cantidadJugadores.textContent =
                    datos.jugadores;

            }


            mensaje.textContent = "";

        }


        // =========================
        // ACTUALIZAR JUGADORES
        // =========================

        socket.on(
            "actualizarJugadores",
            (jugadores) => {

                cantidadJugadores.textContent =
                    jugadores.length;

                mostrarJugadores(jugadores);

            }
        );


        // =========================
        // ERROR DE SALA
        // =========================

        socket.on("errorSala", (texto) => {

            mensaje.textContent =
                texto;

        });


        // =========================
        // MOSTRAR JUGADORES
        // =========================

        function mostrarJugadores(jugadores) {

            cancha.innerHTML = "";


            jugadores.forEach((jugador) => {

                const elemento =
                    document.createElement("div");


                elemento.classList.add(
                    "jugador"
                );


                // Nuestro jugador

                if (jugador.id === miId) {

                    elemento.classList.add(
                        "jugador1"
                    );


                    miJugador.x =
                        jugador.x;

                    miJugador.y =
                        jugador.y;

                }

                // Otros jugadores

                else {

                    elemento.classList.add(
                        "otroJugador"
                    );

                }


                elemento.style.left =
                    jugador.x + "px";

                elemento.style.top =
                    jugador.y + "px";


                cancha.appendChild(elemento);

            });

        }


        // =========================
        // TECLADO
        // =========================

        const teclas = {};


        document.addEventListener(
            "keydown",
            (evento) => {

                const tecla =
                    evento.key.toLowerCase();


                // Evitar problemas con teclas repetidas

                teclas[tecla] = true;


                // Evitar que algunas teclas
                // hagan scroll en la página

                if (
                    tecla === "w" ||
                    tecla === "a" ||
                    tecla === "s" ||
                    tecla === "d"
                ) {

                    evento.preventDefault();

                }

            }
        );


        document.addEventListener(
            "keyup",
            (evento) => {

                const tecla =
                    evento.key.toLowerCase();

                teclas[tecla] = false;

            }
        );


        // =========================
        // MOVIMIENTO
        // =========================

        function actualizarMovimiento() {

            // Si todavía no estamos jugando

            if (!estoyEnJuego) {

                requestAnimationFrame(
                    actualizarMovimiento
                );

                return;

            }


            const velocidad = 5;


            // W

            if (teclas["w"]) {

                miJugador.y -= velocidad;

            }


            // S

            if (teclas["s"]) {

                miJugador.y += velocidad;

            }


            // A

            if (teclas["a"]) {

                miJugador.x -= velocidad;

            }


            // D

            if (teclas["d"]) {

                miJugador.x += velocidad;

            }


            // =========================
            // LIMITAR JUGADOR
            // =========================

            const radioJugador = 20;


            miJugador.x =
                Math.max(
                    radioJugador,
                    Math.min(
                        800 - radioJugador,
                        miJugador.x
                    )
                );


            miJugador.y =
                Math.max(
                    radioJugador,
                    Math.min(
                        500 - radioJugador,
                        miJugador.y
                    )
                );


            // =========================
            // ENVIAR AL SERVIDOR
            // =========================

            if (
                teclas["w"] ||
                teclas["s"] ||
                teclas["a"] ||
                teclas["d"]
            ) {

                socket.emit(
                    "moverJugador",
                    {
                        x: miJugador.x,
                        y: miJugador.y
                    }
                );

            }


            // Continuar el bucle

            requestAnimationFrame(
                actualizarMovimiento
            );

        }


        // Iniciar movimiento

        actualizarMovimiento();

    </script>

</body>

</html>
