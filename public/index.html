```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #20232a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #menu {
            width: 400px;
            max-width: 90%;
            margin: 60px auto;
            background: #2c3038;
            padding: 30px;
            border-radius: 15px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #codigoSala {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 5px;
            margin: 15px;
        }

        #juego {
            display: none;
        }

        #informacion {
            padding: 10px;
        }

        #cancha {
            width: 800px;
            height: 500px;
            max-width: 95vw;
            margin: auto;
            background: #6ab04c;
            border: 5px solid white;
            position: relative;
            overflow: hidden;
        }

        .jugador {
            width: 40px;
            height: 40px;
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .jugador1 {
            background: #3498db;
        }

        .otroJugador {
            background: #f1c40f;
        }

        #mensaje {
            color: #ffd166;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div id="menu">
        <h1>🎮 Juego Online</h1>

        <h2>Crear sala</h2>

        <button id="crearSala">
            Crear sala
        </button>

        <hr>

        <h2>Unirse</h2>

        <input
            id="codigoInput"
            maxlength="5"
            placeholder="Código de sala"
            autocomplete="off"
        >

        <button id="unirseSala">
            Unirse a sala
        </button>

        <p id="mensaje"></p>
    </div>

    <div id="juego">
        <div id="informacion">
            <h2>
                Sala:
                <span id="codigoSala"></span>
            </h2>

            <p>
                Jugadores:
                <span id="cantidadJugadores">0</span>
                /4
            </p>

            <p>
                Usá W A S D para moverte
            </p>
        </div>

        <div id="cancha"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const menu = document.getElementById("menu");
        const juego = document.getElementById("juego");
        const crearSala = document.getElementById("crearSala");
        const unirseSala = document.getElementById("unirseSala");
        const codigoInput = document.getElementById("codigoInput");
        const codigoSala = document.getElementById("codigoSala");
        const cantidadJugadores = document.getElementById("cantidadJugadores");
        const cancha = document.getElementById("cancha");
        const mensaje = document.getElementById("mensaje");

        let miId = null;
        let estoyEnJuego = false;

        let miJugador = {
            x: 200,
            y: 200
        };

        const teclas = {};

        socket.on("connect", () => {
            miId = socket.id;
        });

        socket.on("disconnect", () => {
            estoyEnJuego = false;
            mensaje.textContent = "Desconectado del servidor.";
        });

        crearSala.addEventListener("click", () => {
            socket.emit("crearSala");
        });

        unirseSala.addEventListener("click", () => {
            const codigo = codigoInput.value.trim().toUpperCase();

            if (codigo === "") {
                mensaje.textContent = "Escribí un código.";
                return;
            }

            if (codigo.length !== 5) {
                mensaje.textContent = "El código debe tener 5 caracteres.";
                return;
            }

            socket.emit("unirseSala", codigo);
        });

        socket.on("salaCreada", (datos) => {
            entrarAlJuego(datos);
        });

        socket.on("salaUnida", (datos) => {
            entrarAlJuego(datos);
        });

        function entrarAlJuego(datos) {
            menu.style.display = "none";
            juego.style.display = "block";
            estoyEnJuego = true;

            codigoSala.textContent = datos.codigo;
            cantidadJugadores.textContent = datos.jugadores;
            mensaje.textContent = "";
        }

        socket.on("actualizarJugadores", (jugadores) => {
            cantidadJugadores.textContent = jugadores.length;

            jugadores.forEach((jugador) => {
                if (jugador.id === miId && !teclaMovimiento()) {
                    miJugador.x = jugador.x;
                    miJugador.y = jugador.y;
                }
            });

            mostrarJugadores(jugadores);
        });

        socket.on("errorSala", (texto) => {
            mensaje.textContent = texto;
        });

        function mostrarJugadores(jugadores) {
            cancha.innerHTML = "";

            jugadores.forEach((jugador) => {
                const elemento = document.createElement("div");

                elemento.classList.add("jugador");

                if (jugador.id === miId) {
                    elemento.classList.add("jugador1");
                } else {
                    elemento.classList.add("otroJugador");
                }

                elemento.style.left = jugador.x + "px";
                elemento.style.top = jugador.y + "px";

                cancha.appendChild(elemento);
            });

            dibujarJugadorLocal();
        }

        document.addEventListener("keydown", (evento) => {
            const tecla = evento.key.toLowerCase();

            if (
                tecla === "w" ||
                tecla === "a" ||
                tecla === "s" ||
                tecla === "d"
            ) {
                evento.preventDefault();
                teclas[tecla] = true;
            }
        });

        document.addEventListener("keyup", (evento) => {
            const tecla = evento.key.toLowerCase();

            if (
                tecla === "w" ||
                tecla === "a" ||
                tecla === "s" ||
                tecla === "d"
            ) {
                teclas[tecla] = false;
            }
        });

        window.addEventListener("blur", () => {
            teclas["w"] = false;
            teclas["a"] = false;
            teclas["s"] = false;
            teclas["d"] = false;
        });

        function teclaMovimiento() {
            return (
                teclas["w"] ||
                teclas["a"] ||
                teclas["s"] ||
                teclas["d"]
            );
        }

        let ultimoEnvio = 0;
        const intervaloServidor = 33;

        function actualizarMovimiento(timestamp) {
            if (estoyEnJuego) {
                const velocidad = 5;

                if (teclas["w"]) {
                    miJugador.y -= velocidad;
                }

                if (teclas["s"]) {
                    miJugador.y += velocidad;
                }

                if (teclas["a"]) {
                    miJugador.x -= velocidad;
                }

                if (teclas["d"]) {
                    miJugador.x += velocidad;
                }

                miJugador.x = Math.max(
                    20,
                    Math.min(780, miJugador.x)
                );

                miJugador.y = Math.max(
                    20,
                    Math.min(480, miJugador.y)
                );

                dibujarJugadorLocal();

                if (
                    teclaMovimiento() &&
                    timestamp - ultimoEnvio >= intervaloServidor
                ) {
                    ultimoEnvio = timestamp;

                    socket.emit("moverJugador", {
                        x: miJugador.x,
                        y: miJugador.y
                    });
                }
            }

            requestAnimationFrame(actualizarMovimiento);
        }

        function dibujarJugadorLocal() {
            let jugadorLocal =
                document.getElementById("miJugadorVisual");

            if (!jugadorLocal) {
                jugadorLocal = document.createElement("div");

                jugadorLocal.id = "miJugadorVisual";

                jugadorLocal.classList.add(
                    "jugador",
                    "jugador1"
                );

                cancha.appendChild(jugadorLocal);
            }

            jugadorLocal.style.left = miJugador.x + "px";
            jugadorLocal.style.top = miJugador.y + "px";
        }

        requestAnimationFrame(actualizarMovimiento);
    </script>

</body>
</html>
